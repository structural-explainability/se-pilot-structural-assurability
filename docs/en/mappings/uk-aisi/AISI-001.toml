source_structure = """
The template develops a structured inability argument using Claims,
Arguments, Evidence. Its described elements include: an overall safety
claim; more specific subclaims; risk models; proxy tasks derived from
those risk models; evaluation settings; evaluation results; arguments
concerning evaluation sufficiency. The accompanying explanation identifies
concerns including inadequate capability elicitation. These are
source-described components of the safety-case approach.
"""

evaluative_claim = "The template considers an argument that an AI system lacks capabilities sufficient to pose unacceptable offensive cyber risk."
claim_adoption_status = "The pilot does not adopt that claim for any particular AI system."

required_distinctions = """
The investigation must identify which alternatives the relevant evidence
is intended to distinguish. For example, a constructed model might
distinguish between systems that produce the same proxy-task results but
differ in their capabilities in a specified risk context. Whether those
alternatives are admissible under the template's assumptions must be
established before treating them as a counterexample.
"""

